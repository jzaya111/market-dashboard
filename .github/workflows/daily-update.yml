name: Daily Capital Markets Update

on:
  schedule:
    # 11:00 UTC = 7:00 AM ET (EDT) / 6:00 AM ET (EST during winter).
    # GitHub cron is fixed UTC and does not shift with U.S. daylight saving —
    # adjust this if you want a fixed local time year-round.
    - cron: '0 11 * * 1-5'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data and render dashboard
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_and_render.py

      - name: Commit and push if the dashboard changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily dashboard update"
          file_pattern: "docs/index.html"
